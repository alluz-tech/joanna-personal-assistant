services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Binding to loopback keeps the app private to this machine.
      - "127.0.0.1:5089:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
